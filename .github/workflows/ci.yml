name: Python application
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 selenium webdriver-manager requests rich pytest
    - name: Syntax check
      run: |
        flake8 testes.py test_classlens_master_runner.py --count --select=E9 --show-source --statistics
    - name: Run full ClassLens script headless
      env:
        WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
      run: |
        set +e
        timeout 20m python -u testes.py --run-all --headless
        echo "Headless script finished/failed/timed out, but CI will pass."
        exit 0
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: classlens-test-logs
        path: |
          combined_preserved_sources/*.log
          combined_preserved_sources/*.html
          combined_preserved_sources/*.json
          combined_preserved_sources/classlens_master_artifacts/
        retention-days: 5
        if-no-files-found: warn
