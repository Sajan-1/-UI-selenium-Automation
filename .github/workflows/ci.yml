name: Python application

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - run: |
        python -m pip install --upgrade pip
        pip install flake8 selenium webdriver-manager requests rich

    - run: |
        flake8 testes.py test_classlens_master_runner.py --count --select=E9 --show-source --statistics

    - name: Run headless
      run: |
        set +e
        timeout 20m python -u testes.py --run-all --headless
        echo "Workflow continues regardless of script result"
        exit 0
